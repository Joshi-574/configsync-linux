---
- name: Read current system timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: current_timezone
  changed_when: false
  check_mode: false

- name: Preview timezone change in check mode
  ansible.builtin.debug:
    msg: "Timezone will change from {{ current_timezone.stdout }} to {{ timezone }}"
  when:
    - ansible_check_mode
    - current_timezone.stdout != timezone
  changed_when: true

- name: Configure system timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ timezone }}"
  when:
    - not ansible_check_mode
    - current_timezone.stdout != timezone
  changed_when: true
- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
